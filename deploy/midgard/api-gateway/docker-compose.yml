# api-gateway de ves-market-watch, desplegado por el receptor de webhooks.
#
# La infraestructura con estado (RabbitMQ + TimescaleDB) NO vive aqui: es un
# stack aparte en /srv/infra/ves-market, fuera del ciclo de despliegue. Este
# compose solo describe el servicio sin estado que si se redespliega en cada
# release, y por eso el rollback del receptor es seguro: este contenedor no
# toca el esquema de la base.
#
# Se comunica con la infraestructura por la red externa `ves-market`, no por
# puertos del host.

name: ves-api-gateway

services:
  api-gateway:
    image: ghcr.io/jeremialcala/ves-market-watch/api-gateway:${IMAGE_TAG:?IMAGE_TAG es obligatorio}
    container_name: ves-api-gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HTTP_HOST: 0.0.0.0
      # La red `ves-market`, donde vive `ves-tunel`: solo desde ella se cree
      # `CF-Connecting-IP` para la cuota por IP de `/portal/v1` (ADR-0028 §3).
      # Es la subred que Docker le dio al crearla (`docker network inspect
      # ves-market`); si se recrea, comprobar que sigue siendo esta.
      TRUSTED_PROXIES: 172.22.0.0/16
      # Orígenes de navegador que pueden leer la API (ADR-0017), aquí y no en
      # el .env: no es un secreto, y así cada cambio pasa por un PR. El panel
      # (`criterio-dev`), el portal en Workers (ADR-0035) y el panel en local
      # contra este gateway (Vite en 5173, nginx en 8080; el portal se prueba
      # ahí con `wrangler dev --port 8080`). Pisa al del .env si lo hubiera.
      ALLOWED_ORIGINS: https://criterio-dev.higerotech.com,https://criterio.higerotech.com,http://localhost:5173,http://localhost:8080
    ports:
      # Solo loopback: quien lo publique hacia fuera sera un tunel, no este fichero.
      - "127.0.0.1:8800:8000"
    networks: [ves-market]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

networks:
  ves-market:
    external: true
