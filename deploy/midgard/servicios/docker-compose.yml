# Los servicios de Criterio en midgard (`hgtech001`) que todavía no despliega el
# receptor: captura, motor, panel, túnel y respaldo. Vive en
# `/srv/apps/ves-market`.
#
# El gateway NO está aquí: lo despliega el receptor desde
# `/srv/apps/ves-api-gateway` en cada release. La base y el bus tampoco: son
# `/srv/infra/ves-market`. Los tres stacks se ven por la red externa
# `ves-market`.
#
# Las imágenes llegaron el 2026-10-13 copiadas de la máquina de desarrollo con
# `docker save | docker load` (ADR-0034), no de un registro. Van etiquetadas con
# el nombre que tendrán en GHCR para que pasar al despliegue continuo sea
# cambiar IMAGE_TAG y nada más; hasta entonces, `ghcr.io/…:traslado-20261013`
# existe solo en el disco de midgard y un `docker compose pull` falla. Eso es
# lo esperado, no un problema de red.
#
# Requiere `.env` (root, 600). Las claves están en `env.ejemplo`.

name: ves-market-servicios

x-comun: &comun
  restart: unless-stopped
  networks: [ves-market]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  ingestor-binance:
    <<: *comun
    image: ghcr.io/jeremialcala/ves-market-watch/ingestor-binance:${IMAGE_TAG:?falta IMAGE_TAG en .env}
    container_name: ves-ingestor-binance
    environment:
      DATABASE_URL: ${DATABASE_URL:?falta DATABASE_URL en .env}
      AMQP_URL: ${AMQP_URL:?falta AMQP_URL en .env}
      # La MISMA clave que en desarrollo (ADR-0011). Otra distinta no falla:
      # produce otros `merchant_ref` y parte en dos la serie de cada comerciante.
      MERCHANT_HMAC_KEY: ${MERCHANT_HMAC_KEY:?falta MERCHANT_HMAC_KEY en .env}
      TOP_K: "200"
      FETCH_INTERVAL_SECONDS: "60"
      REQUEST_BUDGET_PER_MIN: "40"
      PAGINAS_EN_PARALELO: "4"
    mem_limit: 256m

  ingestor-bcv:
    <<: *comun
    image: ghcr.io/jeremialcala/ves-market-watch/ingestor-bcv:${IMAGE_TAG:?falta IMAGE_TAG en .env}
    container_name: ves-ingestor-bcv
    environment:
      DATABASE_URL: ${DATABASE_URL:?falta DATABASE_URL en .env}
      AMQP_URL: ${AMQP_URL:?falta AMQP_URL en .env}
      FETCH_INTERVAL_SECONDS: "1800"
    mem_limit: 256m

  indicator-engine:
    <<: *comun
    image: ghcr.io/jeremialcala/ves-market-watch/indicator-engine:${IMAGE_TAG:?falta IMAGE_TAG en .env}
    container_name: ves-indicator-engine
    environment:
      DATABASE_URL: ${DATABASE_URL:?falta DATABASE_URL en .env}
      AMQP_URL: ${AMQP_URL:?falta AMQP_URL en .env}
    mem_limit: 512m

  web-spa:
    <<: *comun
    # El bundle lleva HORNEADOS el dominio de Auth0 y la URL del API con que se
    # construyó: los del túnel de desarrollo. Cambiar de hostname es reconstruir
    # la imagen, no tocar una variable aquí.
    image: ghcr.io/jeremialcala/ves-market-watch/web-spa:${IMAGE_TAG:?falta IMAGE_TAG en .env}
    container_name: ves-web-spa
    ports:
      # Solo loopback, para comprobar desde la máquina. Hacia fuera sale por el
      # túnel, que lo alcanza por nombre.
      - "127.0.0.1:8080:80"
    mem_limit: 64m

  cloudflared:
    <<: *comun
    # El ingress del túnel está en el panel de Cloudflare y apunta a NOMBRES:
    # `http://web-spa:80` y `http://api-gateway:8000`. Resuelven porque los dos
    # servicios se llaman así en sus compose y están en esta red. Renombrar
    # cualquiera de los dos rompe el acceso público sin un solo error aquí.
    image: cloudflare/cloudflared:2026.6.0@sha256:55d8bb268e90b09d3bf05a9bb5d3bc6ddad1b0b69739e4f15daaa7e6676238b6
    container_name: ves-tunel
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?falta CLOUDFLARE_TUNNEL_TOKEN en .env}
    mem_limit: 128m

  respaldo:
    <<: *comun
    image: ghcr.io/jeremialcala/ves-market-watch/respaldo:${IMAGE_TAG:?falta IMAGE_TAG en .env}
    container_name: ves-respaldo
    # `tini` como PID 1, igual que en desarrollo: `crond` no cosecha zombis.
    init: true
    environment:
      PGHOST: timescaledb
      PGPORT: "5432"
      PGUSER: ves
      PGPASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
      PGDATABASE: ves_market
      RCLONE_REMOTE: ${RCLONE_REMOTE:?falta RCLONE_REMOTE en .env}
      RCLONE_CONFIG: /config/rclone/rclone.conf
      RCLONE_CONFIG_PASS: ${RCLONE_CONFIG_PASS:?falta RCLONE_CONFIG_PASS en .env}
      AVISO_URL: ${AVISO_URL:-}
    healthcheck:
      test: ["CMD", "estado"]
      interval: 5m
      timeout: 10s
      retries: 1
      start_period: 75m
    volumes:
      - rclone_config:/config/rclone
      - respaldo_estado:/var/lib/respaldo
    # rclone sube a B2 en trozos de 96 MiB, cuatro a la vez, y los tiene en
    # memoria: el full pide unos 400 MiB solo para eso.
    mem_limit: 1g

volumes:
  # Con nombre fijo: no dependen del nombre del proyecto compose. `rclone_config`
  # lleva la clave de B2 cifrada con RCLONE_CONFIG_PASS.
  rclone_config:
    name: ves_rclone_config
  respaldo_estado:
    name: ves_respaldo_estado

networks:
  ves-market:
    external: true
