# ingestor-bcv de ves-market-watch, desplegado por el receptor de webhooks.
# Vive en `/srv/apps/ves-ingestor-bcv`.
#
# Lo redespliega el workflow `build-ingestor-bcv` en cada release a `main` que
# toque su código; a los demás servicios no los mueve. El nombre del proyecto
# compose tiene que ser el `name` de la app en el inventario del receptor, que
# llama a compose con `-p ves-ingestor-bcv`.
#
# Sin `health_url` en el inventario: no expone HTTP. El receptor da el
# despliegue por bueno en cuanto el contenedor arranca, y no hay rollback
# automático. Tras un release, mirar `docker logs ves-ingestor-bcv`.
#
# La base y el bus viven en `/srv/infra/ves-market`; se llega a ellos por la
# red externa `ves-market`, no por puertos del host.

name: ves-ingestor-bcv

services:
  ingestor-bcv:
    image: ghcr.io/jeremialcala/ves-market-watch/ingestor-bcv:${IMAGE_TAG:?IMAGE_TAG es obligatorio}
    container_name: ves-ingestor-bcv
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?falta DATABASE_URL en .env}
      AMQP_URL: ${AMQP_URL:?falta AMQP_URL en .env}
      FETCH_INTERVAL_SECONDS: "1800"
    mem_limit: 256m
    networks: [ves-market]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

networks:
  ves-market:
    external: true
