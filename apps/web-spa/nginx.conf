# SPA estático (ADR-0017). Las cabeceras de seguridad viven en
# `nginx-security-headers.conf` y se incluyen aquí Y en cada location que
# declare `add_header` propio: nginx no las hereda si el location define los
# suyos, y esa herencia es lo que dejó al sitio sin CSP durante un tiempo.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/security-headers.conf;

    # Assets con hash en el nombre: cache larga e inmutable.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html nunca se cachea (el deploy nuevo debe verse al recargar).
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store";
    }

    # Fallback de SPA: cualquier ruta del cliente sirve el index. Sin
    # `add_header` propio, así que hereda los del server.
    location / {
        try_files $uri /index.html;
    }
}
