# SPA estático (ADR-0017). Cabeceras de seguridad alineadas a T12: CSP sin
# unsafe-inline para scripts (Vite emite bundles sin inline), sin iframes
# (clickjacking) y connect-src limitado a la API y al tenant Auth0.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://localhost:8800 ws://localhost:8800 https://dev-higerotech.us.auth0.com; frame-ancestors 'none'; base-uri 'self'" always;

    # Assets con hash en el nombre: cache larga e inmutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html nunca se cachea (el deploy nuevo debe verse al recargar).
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Fallback de SPA: cualquier ruta del cliente sirve el index.
    location / {
        try_files $uri /index.html;
    }
}
