[project]
name = "api-gateway"
version = "0.1.0"
description = "Punto de entrada de la plataforma: REST + WSS, Resource Server OIDC (valida access tokens de Auth0)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.29",
    "aio-pika>=9.4",
    "jsonschema>=4.21",
    "PyJWT[crypto]>=2.8",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pyyaml>=6.0",
]

[project.scripts]
api-gateway = "api_gateway.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "integration: adaptadores contra infraestructura real (docker compose up -d --wait)",
    "e2e: flujo completo contra RabbitMQ y TimescaleDB reales (docker compose up -d --wait)",
]
