# Publica la imagen de indicator-engine en GHCR para el despliegue continuo en midgard
# (receptor: github.com/higerotech/despliegue-continuo).
#
# El NOMBRE de este workflow es contrato: el receptor despliega la app
# `ves-indicator-engine` cuando termina con éxito un workflow_run llamado exactamente
# `build-indicator-engine` sobre `main`. Renombrarlo detiene los despliegues en silencio.
#
# La construcción en sí está en `publicar-imagen.yml`.
name: build-indicator-engine

on:
  push:
    branches: [main]
    # El Dockerfile copia `apps/indicator-engine/` y `schemas/`. Los tests no entran
    # en la imagen.
    paths:
      - "apps/indicator-engine/**"
      - "!apps/indicator-engine/tests/**"
      - "schemas/**"
      - ".github/workflows/build-indicator-engine.yml"
      - ".github/workflows/publicar-imagen.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-indicator-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  imagen:
    uses: ./.github/workflows/publicar-imagen.yml
    with:
      servicio: indicator-engine
      dockerfile: apps/indicator-engine/Dockerfile

# El despliegue NO se dispara desde aquí. Al completarse este workflow, GitHub
# emite workflow_run hacia el webhook de midgard, que valida la firma, empareja
# contra su inventario y despliega el tag sha-xxxxxxx.
