# Publica la imagen de web-spa en GHCR para el despliegue continuo en midgard
# (receptor: github.com/higerotech/despliegue-continuo).
#
# El NOMBRE de este workflow es contrato: el receptor despliega la app
# `ves-web-spa` cuando termina con éxito un workflow_run llamado exactamente
# `build-web-spa` sobre `main`. Renombrarlo detiene los despliegues en silencio.
#
# La construcción en sí está en `publicar-imagen.yml`.
name: build-web-spa

on:
  push:
    branches: [main]
    # El Dockerfile copia `apps/web-spa/`, el paquete compartido
    # `packages/criterio-ui/` y los manifiestos del workspace de la raíz
    # (ADR-0031): un cambio en cualquiera cambia la imagen. Los tests no entran.
    paths:
      - "apps/web-spa/**"
      - "!apps/web-spa/tests/**"
      - "package.json"
      - "package-lock.json"
      - "packages/criterio-ui/**"
      - "!packages/criterio-ui/tests/**"
      - ".github/workflows/build-web-spa.yml"
      - ".github/workflows/publicar-imagen.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-web-spa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  imagen:
    uses: ./.github/workflows/publicar-imagen.yml
    with:
      servicio: web-spa
      dockerfile: apps/web-spa/Dockerfile
      # El bundle lleva HORNEADA la URL del API, y la misma variable alimenta la
      # CSP del nginx. Esta imagen es la del entorno `criterio-dev`: con otro
      # hostname (D12) hace falta otro valor aquí, no en el servidor. El dominio
      # de Auth0, el client id y la audiencia salen de los defaults del
      # Dockerfile, que son los de ese mismo entorno.
      build-args: |
        VITE_API_BASE_URL=https://criterio-api-dev.higerotech.com

# El despliegue NO se dispara desde aquí. Al completarse este workflow, GitHub
# emite workflow_run hacia el webhook de midgard, que valida la firma, empareja
# contra su inventario y despliega el tag sha-xxxxxxx.
