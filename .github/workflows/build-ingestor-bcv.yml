# Publica la imagen de ingestor-bcv en GHCR para el despliegue continuo en midgard
# (receptor: github.com/higerotech/despliegue-continuo).
#
# El NOMBRE de este workflow es contrato: el receptor despliega la app
# `ves-ingestor-bcv` cuando termina con éxito un workflow_run llamado exactamente
# `build-ingestor-bcv` sobre `main`. Renombrarlo detiene los despliegues en silencio.
#
# La construcción en sí está en `publicar-imagen.yml`.
name: build-ingestor-bcv

on:
  push:
    branches: [main]
    # El Dockerfile solo copia `apps/ingestor-bcv/`, y los tests no entran en la
    # imagen: un cambio que solo toque tests no reinicia la captura.
    paths:
      - "apps/ingestor-bcv/**"
      - "!apps/ingestor-bcv/tests/**"
      - ".github/workflows/build-ingestor-bcv.yml"
      - ".github/workflows/publicar-imagen.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-ingestor-bcv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  imagen:
    uses: ./.github/workflows/publicar-imagen.yml
    with:
      servicio: ingestor-bcv
      dockerfile: apps/ingestor-bcv/Dockerfile

# El despliegue NO se dispara desde aquí. Al completarse este workflow, GitHub
# emite workflow_run hacia el webhook de midgard, que valida la firma, empareja
# contra su inventario y despliega el tag sha-xxxxxxx.
