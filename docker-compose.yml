# Infraestructura compartida de desarrollo/test (ADR-0002, ADR-0004) más los
# servicios de la plataforma para captura continua local.
# Efímera a propósito: sin volúmenes persistentes, credenciales por defecto
# SOLO para localhost. Producción se define en fase 05-deployment.
#
#   docker compose up -d --wait --build
#   docker compose down
#
# Requiere .env en la raíz con MERCHANT_HMAC_KEY (ADR-0011); el .dockerignore
# garantiza que el .env nunca entra en las imágenes.

name: ves-market-watch

services:
  rabbitmq:
    image: rabbitmq:4-management
    # Sin esto, un reinicio del daemon de Docker deja la infra caída mientras
    # los servicios (que sí reinician) quedan en crash-loop (visto 2026-07-23).
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672" # UI de gestión: http://localhost:15672 (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ves_market
    ports:
      # 5433 en el host: el 5432 suele estar ocupado por un PostgreSQL local/WSL.
      - "5433:5432"
    volumes:
      # La DB de desarrollo nace con el esquema del ingestor aplicado.
      # Archivo individual (no el directorio): montar el directorio completo
      # aplastaría el init propio de la imagen (000_install_timescaledb.sh),
      # que instala la extensión en template1.
      - ./apps/ingestor-bcv/db/migrations/001_official_rates.sql:/docker-entrypoint-initdb.d/900_official_rates.sql:ro
      - ./apps/ingestor-bcv/db/migrations/002_suspect_resolution.sql:/docker-entrypoint-initdb.d/901_suspect_resolution.sql:ro
      - ./apps/indicator-engine/db/migrations/001_indicators.sql:/docker-entrypoint-initdb.d/902_indicators.sql:ro
      - ./apps/indicator-engine/db/migrations/002_signals.sql:/docker-entrypoint-initdb.d/902b_signals.sql:ro
      - ./apps/indicator-engine/db/migrations/003_analysis.sql:/docker-entrypoint-initdb.d/902c_analysis.sql:ro
      - ./apps/indicator-engine/db/migrations/004_indicators_compression.sql:/docker-entrypoint-initdb.d/902d_indicators_compression.sql:ro
      - ./apps/ingestor-binance/db/migrations/001_p2p_snapshots.sql:/docker-entrypoint-initdb.d/903_p2p_snapshots.sql:ro
      - ./apps/ingestor-historico/db/migrations/001_historical_snapshots.sql:/docker-entrypoint-initdb.d/904_historical_snapshots.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ves_market"]
      interval: 5s
      timeout: 5s
      retries: 12

  ingestor-binance:
    build:
      context: .
      dockerfile: apps/ingestor-binance/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@timescaledb:5432/ves_market
      AMQP_URL: amqp://guest:guest@rabbitmq/
      MERCHANT_HMAC_KEY: ${MERCHANT_HMAC_KEY:?definir MERCHANT_HMAC_KEY en .env (ADR-0011)}
      # Captura del top-200 por lado, un ciclo por minuto. El presupuesto de
      # requests (RF-1) cubre los 20 requests/ciclo con holgura.
      TOP_K: "200"
      FETCH_INTERVAL_SECONDS: "60"
      REQUEST_BUDGET_PER_MIN: "40"
    depends_on:
      rabbitmq:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  ingestor-bcv:
    build:
      context: .
      dockerfile: apps/ingestor-bcv/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@timescaledb:5432/ves_market
      AMQP_URL: amqp://guest:guest@rabbitmq/
      FETCH_INTERVAL_SECONDS: "1800"
    depends_on:
      rabbitmq:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  indicator-engine:
    build:
      context: .
      dockerfile: apps/indicator-engine/Dockerfile
    # Modo reactivo continuo (CMD de la imagen): desde fase 2 el motor recalcula
    # indicadores ante cada p2p.snapshot (2/min) y cada tasa BCV — procesar por
    # lotes retrasaría justo lo que el motor existe para producir.
    environment:
      DATABASE_URL: postgresql://postgres:postgres@timescaledb:5432/ves_market
      AMQP_URL: amqp://guest:guest@rabbitmq/
    depends_on:
      rabbitmq:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    # Resource Server OIDC (ADR-0012): la config de Auth0 (issuer/audience/JWKS)
    # es pública y va en defaults del código; aquí solo infra y bind del puerto.
    environment:
      DATABASE_URL: postgresql://postgres:postgres@timescaledb:5432/ves_market
      AMQP_URL: amqp://guest:guest@rabbitmq/
      HTTP_HOST: 0.0.0.0
      # SPA en dev (vite, 5173), build nginx del compose (8080) y el host del
      # túnel Cloudflare (HTTPS real, que es lo que hace al cliente «verificable»
      # para Auth0 y mata la pantalla de consentimiento). Parametrizado para no
      # tener que editar el compose por entorno.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8080,https://criterio-dev.higerotech.com}
    ports:
      # 8800 en el host: el 8000 suele estar ocupado por otro proyecto local.
      - "8800:8000" # REST /api/v1 + WSS /ws/v1 (health público: /api/v1/health)
    # Sin esto, `up -d --wait` devuelve con uvicorn todavía arrancando: compose
    # da por bueno un servicio sin healthcheck en cuanto el contenedor corre.
    # Lo pagaba quien encadenara algo detrás —el e2e en vivo del pipeline lo
    # hace— viendo un «connection refused» que parecía del gateway y era del
    # reloj. `urlopen` levanta en cualquier código != 2xx, así que el 503 de
    # `database: down` cuenta como no listo; el 200 de `degraded` (broker o
    # JWKS caídos) cuenta como listo, que es la verdad: el REST está sirviendo.
    # Python y no curl porque la imagen es `python:3.12-slim` y no lo trae.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      rabbitmq:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  cloudflared:
    # Publica el dev por el túnel de Cloudflare, y existe aquí por una razón
    # concreta: **para que el ingress apunte a nombres de servicio y no a una IP**.
    #
    # Hasta el 2026-08-23 el conector corría suelto en la red `bridge`, sin
    # acceso a esta red, así que las reglas del panel tenían que apuntar a la IP
    # de LAN del host. Esa IP es de DHCP: cambió de `192.168.1.43` a `.46` y se
    # llevó por delante el entorno entero —la regla del API acabó apuntando al
    # puerto del SPA, con lo que cada llamada del cliente recibía un `index.html`
    # y el WSS nunca hacía upgrade—. Desde esta red, `web-spa` y `api-gateway`
    # resuelven por nombre y no dependen de la red de nadie.
    #
    # `profiles` porque no todo el que levanta el stack quiere —ni puede—
    # exponerlo:  docker compose --profile tunel up -d
    profiles: [tunel]
    # Fijada a la versión que ya corría: el `latest` de un conector se actualiza
    # solo y aquí no interesa descubrir una versión nueva un lunes.
    image: cloudflare/cloudflared:2026.6.0
    command: tunnel --no-autoupdate run
    environment:
      # El token AUTORIZA a servir el túnel: es un secreto, vive en el .env de la
      # raíz (gitignorado) y nunca en este archivo.
      #
      # Va por entorno y no como argumento del `command` porque en la línea de
      # órdenes lo ve cualquiera que haga `docker inspect` —así se filtró uno el
      # 2026-08-23—. Que quede claro: por entorno TAMPOCO es un escondite,
      # `docker inspect` también lo muestra; lo que protege es el .env.
      #
      # Sin `:?` a propósito: el compose interpola el archivo ENTERO aunque el
      # servicio no se levante, y un `:?` rompería `docker compose up` a todo el
      # que no use el túnel.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      # Con el healthcheck del gateway, esperar a `service_healthy` evita los
      # `connection refused` del arranque, que en el log del conector parecen un
      # problema de red y son el reloj.
      api-gateway:
        condition: service_healthy
      web-spa:
        condition: service_started
    restart: unless-stopped

  web-spa:
    build:
      context: .
      dockerfile: apps/web-spa/Dockerfile
      # Un solo input para el bundle Y para la CSP del nginx (ver el Dockerfile).
      # Con los defaults puestos, `docker compose up --build` sin variables se
      # comporta igual que siempre; cambiar de tenant o de dominio es exportar
      # estas variables, no editar tres archivos a mano.
      args:
        VITE_AUTH0_DOMAIN: ${VITE_AUTH0_DOMAIN:-auth.higerotech.com}
        VITE_AUTH0_CLIENT_ID: ${VITE_AUTH0_CLIENT_ID:-8CpfA64FlGTmuyF8w07rDFlrZHEeuRER}
        VITE_AUTH0_AUDIENCE: ${VITE_AUTH0_AUDIENCE:-https://api.vesmarketwatch/}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8800}
    # Dashboard estático (nginx). El browser del host llama al gateway por
    # localhost:8800 (CORS allowlist) — el contenedor solo sirve archivos.
    ports:
      - "8080:80"
    depends_on:
      api-gateway:
        condition: service_started
    restart: unless-stopped
